        </a>
    </div>
    
    <div class="confirm-container">
        <div class="success-icon-wrapper">
            <mat-icon class="success-icon">check_circle</mat-icon>
        </div>

        <p>Your email address has been verified. Your account is now fully activated </p>
        <p>and ready to use.</p>

                <div class="step-number">1</div>

                <div class="step-text">Explore available courses</div>

            <div class="step">
                <div class="step-number">3</div>
                <div class="step-text">Set up your learning preferences</div>
            </div>

        <div class = "options">
            <div class="sign-in-button">
                <a mat-raised-button href="/login">Sign In</a>
            </div>
            <div class="home-button">
