<lmsweb-header></lmsweb-header>
<main class="forgot-password">
  <section class="forgot-password__container">

    <header class="forgot-password__header">
      <h2 class="forgot-password__brand">Antra LMS</h2>
      <h1 class="forgot-password__title">Forgot Password?</h1>
      <p class="forgot-password__subtitle">
        No worries, we'll send you reset instructions
      </p>
    </header>

    <mat-card class="forgot-password__card">

      <section class="forgot-password__info">
        <mat-icon color="primary">info</mat-icon>
        <p>
          Enter the email address associated with your account
          and we'll send you a link to reset your password.
        </p>
      </section>

      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="forgot-password__form"
        aria-label="Forgot Password Form"
      >

        <mat-form-field appearance="outline" class="forgot-password__field">
          <mat-label>Email Address</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="you@company.com"
            aria-describedby="emailHelp"
          />
          <mat-error *ngIf="form.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">
            Enter a valid email
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="forgot-password__submit"
        >
          Send Reset Instructions
        </button>

        <button
          mat-stroked-button
          color="primary"
          type="button"
          class="forgot-password__back"
           [routerLink]="['/login']" 
        >
          <mat-icon>arrow_back</mat-icon>
          Back to Sign In
        </button>

      </form>

      <footer class="forgot-password__footer">
        <p>
          Remember your password?
          <a [routerLink]="['/login']"  >Sign in</a>
        </p>
      </footer>

    </mat-card>
  </section>
</main>
<lmsweb-footer></lmsweb-footer>
